<!doctype html>
<html>
  <head>
    <title>JavaScript</title>
  </head>
  <body>
    <h2>Counter: <span id="count">0</span></h2>
    <button id="addbtn">add</button>
    <button id="subbtn">sub</button>
    <button id="multbtn">multi</button>
    <button id="divbtn">div</button>

    <script>
      const btn = document.getElementById("addbtn");
      btn.addEventListener("click", add);

      const btn1 = document.getElementById("subbtn");
      btn1.addEventListener("click", subtract);

      const btn2 = document.getElementById("multbtn");
      btn2.addEventListener("click", multiply);

      const btn3 = document.getElementById("divbtn");
      btn3.addEventListener("click", divide);

      let a = 10;
      let b = 20;
      function add() {
        let count = a + b;
        document.getElementById("count").innerText = count;
      }
      function subtract() {
        let count = a - b;
        document.getElementById("count").innerText = count;
      }
      function multiply() {
        let count = a * b;
        document.getElementById("count").innerText = count;
      }
      function divide() {
        let count = a / b;
        document.getElementById("count").innerText = count;
      }
    </script>
  </body>
</html>
